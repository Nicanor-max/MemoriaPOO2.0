name: Tests y cobertura

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:cobertura
      - uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: cobertura/
